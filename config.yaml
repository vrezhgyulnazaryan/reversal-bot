exchange: binanceusdm
testnet: true

timeframe: "5m"
lookback_bars: 100

scan:
  quote_currency: USDT
  top_n_movers: 15
  move_window_minutes: 60
  min_abs_move_pct: 5.0
  # skip symbols this thin on 24h volume - avoids the most easily-manipulated listings.
  # NOTE: Binance Demo Trading's volume figures look unrealistic (a random meme coin
  # showing billions in 24h volume) so this threshold is a best-guess for real markets,
  # not something validated against our demo data.
  min_quote_volume_usd: 20000000
  # always scanned by strategy 1 regardless of the 24h-move filter above - these
  # rarely clear a 5% move but can still have a perfectly good intraday setup
  always_scan_symbols:
    - BTC/USDT:USDT
    - ETH/USDT:USDT
    - BNB/USDT:USDT
    - SOL/USDT:USDT

signal:
  rsi_period: 14
  rsi_overbought: 75
  rsi_oversold: 25
  bb_period: 20
  bb_std: 2.0
  atr_period: 14
  orderbook_depth_levels: 50
  orderbook_price_range_pct: 0.5
  min_imbalance_ratio: 1.3
  # a resting order book level counts as a "wall" (real support/resistance) if its
  # size is at least this many times the local median between entry and the ATR stop
  wall_multiplier: 5.0
  min_wall_usd: 5000
  wall_scan_depth: 500

risk:
  # % of equity risked on a single trade if stop-loss is hit
  risk_per_trade_pct: 1.5
  # hard ceiling the bot will refuse to exceed regardless of config edits below this line
  max_risk_per_trade_pct: 5.0
  stop_atr_mult: 1.5
  take_profit_r_multiple: 1.5
  max_leverage: 10
  # every trade uses at least this leverage, capped at max_leverage above
  min_leverage: 5
  # stop-loss is never placed further than this % away from entry (tighter is fine)
  max_stop_pct: 10.0
  # always keep this % of equity free as margin, so a strong new signal always has
  # room to enter - leverage is raised toward max_leverage first to make room before
  # a position's size is ever reduced to fit
  margin_reserve_pct: 15.0
  # skip a new entry if its recent price-return correlation with an already-open
  # position is at or above this - avoids stacking the same risk under different tickers
  max_correlation_with_open: 0.75
  # skip a new entry if funding rate is this costly against the intended side
  # (0.0004 = 0.04% per 8h, roughly 4x the BTC/ETH baseline of 0.01%)
  max_adverse_funding_rate: 0.0004
  max_concurrent_positions: 3
  # bot stops opening new trades for the day once realized loss hits this % of starting equity
  daily_loss_limit_pct: 8.0
  # once a position's unrealized profit reaches this many USD, start trailing the
  # stop-loss behind the best price seen (trail_atr_mult ATRs back) instead of waiting
  # for take-profit or the original stop - re-evaluated every cycle, only ever tightened
  profit_lock_trigger_usd: 25
  trail_atr_mult: 1.5
  # trailing distance never exceeds this % of price, even on a wildly volatile symbol
  # where trail_atr_mult * ATR would otherwise stay very wide
  trail_max_pct: 4.0
  # once profit reaches 2x the trigger above, the trailing multiplier is halved to
  # lock in more as gains grow
  trail_tighten_at_multiple: 2.0

execution:
  order_type: market
  poll_interval_sec: 20
  # reverted: the main (mean-reversion) strategy enters at market like it always did.
  # order-book-based entries are meant to be their own separate approach, not a
  # modification bolted onto this strategy's execution.
  use_limit_entry: false
  entry_limit_timeout_sec: 90

# a second, fully independent strategy - never touches symbols the mean-reversion
# strategy above is already looking at (big 24h movers). Looks for a strong,
# persistent order-book imbalance backed by a real resting wall, on quiet/liquid
# coins that haven't made a big move yet - a leading signal instead of reacting to
# a move that's already happened.
orderbook_strategy:
  # disabled per explicit request 2026-09-11: real trading showed it churning
  # through many small losing trades (BNB/NEAR/DOGE/LDO etc.) faster than it could
  # be trusted. Only the mean-reversion strategy (strategy 1) trades now. Code is
  # left in place, dormant, in case this gets revisited later.
  enabled: false
  top_n_candidates: 20
  min_quote_volume_usd: 20000000
  max_abs_move_pct: 5.0
  # skip a candidate whose 24h high/low band is this wide even if the net % change
  # above looks calm - catches a coin that spiked hard and round-tripped back to
  # roughly where it started (e.g. VVV on 2026-09-11: net change was only +3.8% but
  # the 24h range was ~12%, and the bot chased a long right into that whipsaw)
  max_24h_range_pct: 8.0
  obi_depth_levels: 20
  obi_price_range_pct: 0.5
  obi_threshold: 0.6
  obi_persist_cycles: 2
  wall_multiplier: 5.0
  min_wall_usd: 5000
  wall_scan_depth: 500
  max_stop_pct: 5.0
  take_profit_r_multiple: 1.5
